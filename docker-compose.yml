
services:
  # ============================================================
  # 本地开发模式：注释掉 MySQL、backend、frontend
  # 数据库使用 TiDB Cloud，后端通过 IDE 启动，前端通过 Vue dev server
  # 部署时取消注释即可恢复完整 docker-compose
  # ============================================================
  # MySQL数据库（开发时注释，使用 TiDB Cloud）
  # mysql:
  #   image: mysql:8.0
  #   container_name: electrolyte_mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword123
  #     MYSQL_DATABASE: md_database
  #     MYSQL_USER: mduser
  #     MYSQL_PASSWORD: mdpassword123
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - ./data/mysql:/var/lib/mysql
  #     - ./backend/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
  #   networks:
  #     - md-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     timeout: 20s
  #     retries: 10

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: electrolyte_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - md-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # MD计算引擎容器（仅LAMMPS）
  md-engine:
    build:
      context: ./docker/lammps
      dockerfile: Dockerfile
    container_name: md_engine
    # 暂时注释GPU支持，确保构建成功
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data/inputs:/workspace/inputs
      - ./data/results:/workspace/results
      - ./backend/src/main/resources/scripts:/workspace/scripts
      - ./data/md_platform_data:/workspace/data
      - ./backend/test-data/md_platform_data:/workspace/test_data
    networks:
      - md-network
    privileged: true
    shm_size: 2gb  # 增加共享内存
    restart: unless-stopped
    # 等待 Redis 启动
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # 本地开发模式：注释掉 backend 和 frontend
  # 本地通过 IDE 启动 Spring Boot (:8080) 和 Vue dev server (:5173)
  # ============================================================
  # Spring Boot后端（开发时注释）
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: electrolyte_backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/md_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  #     SPRING_DATASOURCE_USERNAME: mduser
  #     SPRING_DATASOURCE_PASSWORD: mdpassword123
  #     SPRING_REDIS_HOST: redis
  #     SPRING_REDIS_PORT: 6379
  #     MD_ENGINE_HOST: md-engine
  #     MD_ENGINE_PORT: 22
  #     SPRING_PROFILES_ACTIVE: docker
  #     SERVER_PORT: 8080
  #     FILE_UPLOAD_DIR: /app/uploads
  #     FILE_RESULTS_DIR: /app/results
  #     JWT_SECRET: your-jwt-secret-key-here-change-in-production
  #     JWT_EXPIRATION: 86400000
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     md-engine:
  #       condition: service_started
  #   volumes:
  #     - ./data/uploads:/app/uploads
  #     - ./data/results:/app/results
  #     - ./data/logs:/app/logs
  #     - ./scripts:/app/scripts
