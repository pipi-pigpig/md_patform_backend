  #     - ./data/results:/data/results # 关键！
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - md-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

  # Nginx反向代理 + Vue前端（开发时注释）
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: electrolyte_frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   volumes:
  #     - ./frontend/dist:/usr/share/nginx/html
  #   networks:
  #     - md-network
  #   restart: unless-stopped

networks:
  md-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local
  results-data:
    driver: local
  logs-data:
    driver: local