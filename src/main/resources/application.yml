server:
  port: 8080
#  servlet:
#    context-path: /api

spring:
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 100
      thread-name-prefix: Async-
  application:
    name: electrolyte-md-platform

  # MySQL??
  datasource:
    url: jdbc:mysql://localhost:3306/md_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update  # ???????validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  # 文件存储目录
  upload-dir: ./uploads
  results-dir: ./results
  scripts-dir: ./scripts

  # Docker配置
  docker:
    enabled: true  # 设置为false禁用Docker集成（仅平台基础功能可用）
    md-container-name: md-engine
    md-input-path: /workspace/inputs
    md-output-path: /workspace/results
    lammps-command: mpirun -np 4 lmp -in
    gromacs-command: gmx mdrun -deffnm
    timeout-seconds: 3600  # 1小时超时

logging:
  level:
    com.mdplatform: DEBUG
    com.github.dockerjava: INFO
  file:
    name: logs/app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"