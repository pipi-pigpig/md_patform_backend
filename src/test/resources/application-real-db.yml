server:
  port: 0  # 使用随机端口

spring:
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 50
      thread-name-prefix: RealDB-Async-
  application:
    name: electrolyte-md-platform-real-db-test

  # 使用真实TiDB数据库
  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/md_database?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: 2Z2dkBWwpS3FSfM.root
    password: rrlKa4WDsqsSi5Iv
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update  # 使用update确保表结构存在
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # 禁用安全配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

app:
  upload-dir: ./test-uploads
  results-dir: ./test-results
  scripts-dir: ./test-scripts

  docker:
    enabled: true
    md-container-name: md_engine
    md-input-path: /workspace/inputs
    md-output-path: /workspace/results
    lammps-command: mpirun -np 4 lmp -in
    gromacs-command: gmx mdrun -deffnm
    timeout-seconds: 3600  # 1小时超时

logging:
  level:
    com.mdplatform: DEBUG
    com.github.dockerjava: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

md-platform:
  file-storage:
    root-path: ../data/md_platform_data
    temp-retention-hours: 1
    system-templates-path: system_templates
    user-uploads-path: user_uploads
  pipeline:
    timeout-seconds: 7200  # 2小时超时（实际流水线需要较长时间）